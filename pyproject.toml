[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linuy"
version = "1.0.0"
description = "LINUY — Cross-platform, local, read-only defensive security inspection CLI for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "LINUY Contributors" }
]
keywords = ["security", "defensive-security", "cli", "audit", "linux", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psutil>=5.9.8,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.5,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[project.scripts]
linuy = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
exclude = ["tests*", "reports*", "samples*", "build*", "dist*", ".venv*", "venv*", "env*"]

[tool.setuptools.package-data]
sentinel = ["samples/*.jsonl", "samples/*.log", "samples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
